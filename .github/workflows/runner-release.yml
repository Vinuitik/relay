name: Runner build + release

# Publishes a GitHub Release tagged runner-<short-sha> with the linux/amd64
# and windows/amd64 binaries plus a checksums.txt - this is exactly what
# runner/internal/selfupdate polls for (see that package's doc comment for
# why pull-from-GitHub instead of push-via-SSH). Only fires on runner/
# changes, same reasoning as android-deploy.yml's path filter.
on:
  push:
    branches: [main]
    paths:
      - "runner/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Compute version tag
        id: version
        run: echo "tag=runner-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags "-X main.version=${{ steps.version.outputs.tag }}" -o dist/relay-runner-linux-amd64   ./cmd/runnerd
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=${{ steps.version.outputs.tag }}" -o dist/relay-runner-windows-amd64.exe ./cmd/runnerd

      - name: Test
        run: go test ./...

      - name: Checksums
        working-directory: runner/dist
        run: sha256sum relay-runner-linux-amd64 relay-runner-windows-amd64.exe > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/relay-runner-linux-amd64 \
            dist/relay-runner-windows-amd64.exe \
            dist/checksums.txt \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "${{ github.event.head_commit.message }}"
